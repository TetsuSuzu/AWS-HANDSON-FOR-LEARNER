name: OIDC認証の確認

on:
  workflow_dispatch:
  push:
    branches:
      - oidc-deploy-check

permissions:
  id-token: write   # OIDCトークンを発行するために必要
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: AWS認証（OIDC）
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: 認証されたIDを表示
        run: aws sts get-caller-identity
