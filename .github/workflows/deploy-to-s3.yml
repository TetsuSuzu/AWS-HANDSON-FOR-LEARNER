name: S3へ自動デプロイ

on:
  push:
    branches:
      - master
    paths:
      - 'Session1/**'

permissions:
  id-token: write   # OIDCトークンを発行するために必要
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: AWS認証情報を設定（OIDC）
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: S3にデプロイ
        run: |
          aws s3 sync Session1/ s3://aws-learners-s3 \
            --delete \
            --exclude "*.md"
